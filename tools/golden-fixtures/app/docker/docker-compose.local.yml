name: app-golden-local
services:
  postgres-local:
    image: postgres:16-alpine
    container_name: app-golden-postgres-local
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=local_only_not_a_secret
      - POSTGRES_DB=app_local
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app_local']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - app-golden-postgres-local-data:/var/lib/postgresql/data

  # Emulador de Blob: sin él no hay a qué subir en local y el adapter de Azure Storage no se ejercita.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: app-golden-azurite-local
    command: 'azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck'
    ports:
      - '10000:10000'
    volumes:
      - app-golden-azurite-local-data:/data

volumes:
  app-golden-postgres-local-data:
  app-golden-azurite-local-data:
