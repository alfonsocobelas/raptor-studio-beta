name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      # El mismo Postgres efímero que docker-compose.test.yml. El puerto publicado
      # debe coincidir con el que espera environments/test.json.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test_only_not_a_secret
          POSTGRES_DB: app_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (backend + shared + tests)
        run: npm run typecheck

      - name: Fronteras de UI (ADR-003 — las pantallas no importan la librería)
        run: npm run lint:ui-boundaries

      - name: Tests unitarios
        run: npm test

      - name: Tests de integración (contra el Postgres del service)
        run: npm run test:integration

      - name: Tests de frontend (vitest)
        run: npm run test:front

      - name: Build del frontend
        run: npx ng build
