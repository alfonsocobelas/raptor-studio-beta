services:
  postgres-local:
    image: postgres:16-alpine
    container_name: app-postgres-local
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=local_only_not_a_secret
      - POSTGRES_DB=app_local
    ports:
      - '5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app_local']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - app-postgres-local-data:/var/lib/postgresql/data

volumes:
  app-postgres-local-data:
