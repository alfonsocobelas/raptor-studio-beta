# Postgres efímero para integración: sin volumen, tmpfs y fsync off.
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: app-postgres-test
    command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=test_only_not_a_secret
      - POSTGRES_DB=app_test
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app_test']
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
